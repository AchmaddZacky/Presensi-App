<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Koneksi Terputus | PT.BABEN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            background: #F5F7FB;
            font-family: "Poppins", "Segoe UI", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #111827;
        }
        .offline-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 2.25rem 1.75rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            border: 1px solid #E5E7EB;
        }
        .offline-icon-wrap {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 1.25rem;
        }
        .logo-img {
            height: 36px;
            margin-bottom: 1.5rem;
        }
        .btn-retry {
            background: #2563EB;
            color: #FFFFFF;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.65rem 1.5rem;
            border: none;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-retry:hover {
            background: #1D4ED8;
            color: #FFFFFF;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <img src="/images/logo-pt-baben.png" alt="Logo PT.BABEN" class="logo-img">
        <div class="offline-icon-wrap">
            <i class="fa-solid fa-wifi"></i>
        </div>
        <h4 class="fw-bold mb-2">Anda Sedang Offline</h4>
        <p class="text-secondary small mb-4">
            Koneksi internet Anda terputus. Pastikan data seluler atau Wi-Fi Anda aktif, lalu coba muat ulang halaman.
        </p>
        <button class="btn-retry" onclick="window.location.reload()">
            <i class="fa-solid fa-rotate-right"></i> Coba Lagi
        </button>
    </div>
</body>
</html>
